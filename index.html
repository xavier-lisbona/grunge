<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grunge Network</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div>
    <h1>GRUNGE NETWORK</h1>
    <p>Bands, members, and connections</p>
  </div>
  <label>Search <input id="search" type="search" placeholder="person or band…"></label>
</header>
<main>
  <aside>
    <h2>Explore</h2>
    <div class="stats" id="stats"></div>
    <div class="tip" id="tip"></div>
    <button id="reset">Reset</button>
    <div id="results"></div>
  </aside>
  <section>
    <svg id="graph" viewBox="0 0 900 600" aria-label="Relationship graph"></svg>
    <div id="details" class="details">Select a city to begin.</div>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
